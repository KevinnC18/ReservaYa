<div class="flex flex-col md:flex-row min-h-screen bg-background">

  <!-- Barra Superior y Navegación Móvil (< md) -->
  <header class="sticky top-0 z-40 flex flex-col bg-surface text-light border-b border-light/10 md:hidden">
    <div class="flex items-center justify-between px-4 py-3 border-b border-light/10">
      <div class="flex items-center gap-2">
        <span class="text-base font-bold text-primary">ReservaYa</span>
        <span class="rounded bg-light/10 px-2 py-0.5 text-xs text-white/80">{{ restaurante.name }}</span>
      </div>
      <a routerLink="/admin/login"
        class="flex items-center gap-1.5 text-xs text-gray transition-colors hover:text-light">
        <svg class="size-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9" />
        </svg>
        <span>Salir</span>
      </a>
    </div>

    <!-- Pestañas horizontales táctiles -->
    <nav class="flex items-center gap-1 overflow-x-auto px-3 py-2 text-xs font-medium">
      @for (item of menu; track item.id) {
      <button type="button" (click)="setSeccion(item.id)"
        [class]="seccionActiva() === item.id
            ? 'flex items-center gap-1.5 shrink-0 rounded-lg bg-primary px-3 py-1.5 text-light font-semibold'
            : 'flex items-center gap-1.5 shrink-0 rounded-lg px-3 py-1.5 text-gray hover:bg-light/5 hover:text-light transition-colors'">
        <span>{{ item.label }}</span>
      </button>
      }
    </nav>
  </header>

  <!-- Aside Lateral Escritorio (>= md) -->
  <aside
    class="hidden md:flex sticky top-0 h-screen w-48 lg:w-56 shrink-0 flex-col justify-between bg-surface text-light">
    <div class="border-b border-light/10 p-5">
      <p class="text-lg font-bold leading-tight text-primary">ReservaYa</p>
      <p class="mt-0.5 text-xs text-white/75">{{ restaurante.name }} · Panel</p>
    </div>

    <nav class="flex-1 space-y-1 overflow-y-auto p-3">
      @for (item of menu; track item.id) {
      <button type="button" (click)="setSeccion(item.id)"
        [class]="seccionActiva() === item.id
            ? 'flex w-full items-center gap-2 rounded-lg bg-primary px-3 py-2 text-left text-sm font-medium text-light'
            : 'flex w-full items-center gap-2 rounded-lg px-3 py-2 text-left text-sm text-gray transition-colors hover:bg-light/5 hover:text-light'">
        @switch (item.id) {
        @case ('reservas') {
        <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" />
        </svg>
        }
        @case ('estadisticas') {
        <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 19V9m6 10V5m6 14v-8m6 8V3" />
        </svg>
        }
        @case ('resenas') {
        <svg class="size-4" fill="currentColor" viewBox="0 0 20 20">
          <path
            d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.286 3.957a1 1 0 00.95.69h4.162c.969 0 1.371 1.24.588 1.81l-3.37 2.449a1 1 0 00-.364 1.118l1.287 3.957c.3.921-.755 1.688-1.54 1.118l-3.37-2.449a1 1 0 00-1.176 0l-3.37 2.449c-.784.57-1.838-.197-1.539-1.118l1.287-3.957a1 1 0 00-.364-1.118L2.049 9.384c-.783-.57-.38-1.81.588-1.81h4.162a1 1 0 00.95-.69l1.286-3.957z" />
        </svg>
        }
        @case ('perfil') {
        <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        }
        }
        <span>{{ item.label }}</span>
      </button>
      }
    </nav>

    <div class="sticky bottom-0 mt-auto border-t border-light/10 bg-surface p-4">
      <a routerLink="/admin/login" class="flex items-center gap-2 text-sm text-gray transition-colors hover:text-light">
        <span>← Cerrar sesión</span>
      </a>
    </div>
  </aside>

  <!-- Contenido Principal -->
  <main class="flex-1 min-w-0 p-4 sm:p-6 lg:p-8 overflow-y-auto">
    @switch (seccionActiva()) {
    @case ('reservas') {
    <app-reservas />
    }
    @case ('estadisticas') {
    <app-estadisticas />
    }
    @case ('resenas') {
    <app-resenas />
    }
    @case ('perfil') {
    <app-perfil />
    }
    }
  </main>
</div>
